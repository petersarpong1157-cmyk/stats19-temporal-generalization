name: R syntax check

on:
  push:
    paths:
      - "R/**"
      - ".github/workflows/r-syntax.yml"
  pull_request:
    paths:
      - "R/**"
      - ".github/workflows/r-syntax.yml"

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse all R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
          for (f in files) {
            cat("Parsing:", f, "\n")
            parse(file = f)
          }
          cat("All R scripts parsed successfully.\n")
